services:
  quant_indicators:
    image: quant_indicators:latest
    build: .
    container_name: quant_indicators
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://quant:quant_dev_password@localhost:5432/quant}"
      BARS_SCHEMA: ${BARS_SCHEMA:-market_data}
      BARS_TABLE: ${BARS_TABLE:-daily_bars}
      INDICATOR_ADJUSTMENT_TYPE: ${INDICATOR_ADJUSTMENT_TYPE:-unadjusted}
      INDICATOR_LOOKBACK_DAYS: ${INDICATOR_LOOKBACK_DAYS:-550}
      COMPUTE_SCHEDULE_TIME: ${COMPUTE_SCHEDULE_TIME:-01:00}
      COMPUTE_SCHEDULE_TIMEZONE: ${COMPUTE_SCHEDULE_TIMEZONE:-UTC}
      API_LISTEN_ADDRESS: ${API_LISTEN_ADDRESS:-0.0.0.0}
      API_PORT: ${API_PORT:-8001}
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    stdin_open: true
    tty: true
