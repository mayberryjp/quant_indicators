services:
  quant_indicators:
    image: quant_indicators:latest
    build: .
    container_name: quant_indicators
    environment:
      DATABASE_URL: 
      BARS_SCHEMA: ${BARS_SCHEMA:-market_data}
      BARS_TABLE: ${BARS_TABLE:-daily_bars}
      INDICATOR_ADJUSTMENT_TYPE: ${INDICATOR_ADJUSTMENT_TYPE:-unadjusted}
      INDICATOR_LOOKBACK_DAYS: ${INDICATOR_LOOKBACK_DAYS:-400}
      COMPUTE_INTERVAL: 86400
      API_PORT: ${API_PORT:-8001}
    ports:
      - "${API_PORT:-8001}:${API_PORT:-8001}"
    stdin_open: true
    tty: true
